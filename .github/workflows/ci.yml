name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Compile C++ legacy code
        run: cd legacy_cpp && make all

      - name: Compile Rust legacy code
        run: cd legacy_rust && make all

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run benchmarks
        run: cd legacy_cpp && make benchmark
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests/
            legacy_cpp/*.o
            legacy_rust/legacy_compute
            legacy_rust/optimized_compute
